<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Leave Balances Directory — SmartStaffPro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; margin: 0; margin-left: 250px; padding: 40px; color: #1f2937; }

    .glass-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); max-width: 1100px; margin: 0 auto; }

    h2 { color: #1f2937; margin-top: 0; border-bottom: 2px solid #f3f4f6; padding-bottom: 15px; margin-bottom: 20px; font-weight: 700;}

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #f3f4f6; }
    th { background-color: #f9fafb; font-weight: 600; color: #6b7280; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }

    .department-text { color: #6b7280; font-size: 13px; }
    .balance-pill { font-weight: 600; padding: 4px 10px; border-radius: 12px; font-size: 13px; }

    /* Color coding for balances */
    .healthy { background-color: #dcfce3; color: #166534; }
    .warning { background-color: #fef08a; color: #854d0e; }
    .critical { background-color: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div th:replace="~{fragments :: sidebar}"></div>

<div class="glass-card">
  <h2>Real-Time Leave Balances</h2>
  <p style="color: #6b7280; margin-bottom: 20px;">Live overview of remaining entitlements for all active employees.</p>

  <table>
    <thead>
    <tr>
      <th>Employee Name</th>
      <th>Department</th>
      <th>Annual Leave</th>
      <th>Casual Leave</th>
      <th>Medical Leave</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${directory}">
      <td style="font-weight: 600;" th:text="${row.employee.firstName + ' ' + row.employee.lastName}"></td>
      <td class="department-text" th:text="${row.employee.department}"></td>

      <!-- Assumes your map keys are 'Annual', 'Casual', 'Medical'. Adjust if your map uses different keys! -->
      <td>
        <span class="balance-pill healthy" th:text="${row.balances['ANNUAL']} + ' Days'"></span>
      </td>
      <td>
        <span class="balance-pill healthy" th:text="${row.balances['CASUAL']} + ' Days'"></span>
      </td>
      <td>
        <span class="balance-pill healthy" th:text="${row.balances['MEDICAL']} + ' Days'"></span>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
