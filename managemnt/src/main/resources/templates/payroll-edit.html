<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Payslip — SmartStaffPro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; margin-left: 250px; padding: 40px; display: flex; justify-content: center;}
        .form-container { background: white; padding: 30px 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px;}
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        .readonly-text { background-color: #e9ecef; cursor: not-allowed; color: #666; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        button:hover { background-color: #004494; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #6c757d; text-decoration: none; font-size: 14px; font-weight: bold;}
    </style>
</head>
<body>

<div th:replace="~{fragments :: sidebar}"></div>

<div class="form-container">
    <h2>Update Payslip</h2>

    <form th:action="@{/payroll/update/{id}(id=${payroll.id})}" method="post">

        <!-- Read-only details so the user knows whose payslip they are editing -->
        <div class="form-group">
            <label>Employee Name</label>
            <input type="text" class="readonly-text" th:value="${payroll.employee.firstName + ' ' + payroll.employee.lastName}" readonly/>
        </div>
        <div class="form-group">
            <label>Pay Period</label>
            <input type="text" class="readonly-text" th:value="${payroll.payPeriod}" readonly/>
        </div>

        <!-- Editable Allowances and Deductions -->
        <div class="form-group">
            <label>Allowances (Rs.)</label>
            <input type="number" step="0.01" name="allowances" th:value="${payroll.allowances}" required autofocus/>
        </div>
        <div class="form-group">
            <label>Deductions/Tax (Rs.)</label>
            <input type="number" step="0.01" name="deductions" th:value="${payroll.deductions}" required/>
        </div>

        <button type="submit">Update & Recalculate</button>
        <a href="/payroll" class="back-link">Cancel</a>
    </form>
</div>

</body>
</html>
