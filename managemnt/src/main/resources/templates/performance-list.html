<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Performance Hub — SmartStaffPro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; margin: 0; margin-left: 250px; padding: 40px; color: #1f2937; }
    .glass-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-modern { background: #4f46e5; color: white; padding: 10px 20px; border-radius: 10px; text-decoration: none; font-weight: 500; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #f3f4f6; }
    th { background-color: #f9fafb; font-weight: 600; color: #6b7280; }
    .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #dcfce3; color: #166534; }
  </style>
</head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>

<div class="glass-card">
  <div class="header-flex">
    <h2>Employee Performance Records</h2>
    <a href="/performance/evaluate" class="btn-modern">+ New Appraisal</a>
  </div>

  <table>
    <thead>
    <tr>
      <th>Employee</th>
      <th>Period</th>
      <th>Rating</th>
      <th>Calculated Bonus</th>
      <th>Remarks</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="review : ${reviews}">
      <td th:text="${review.employee.firstName + ' ' + review.employee.lastName}"></td>
      <td th:text="${review.reviewPeriod}"></td>
      <td><strong th:text="${review.rating} + ' / 5'"></strong></td>
      <td><span class="badge" th:text="${review.bonusPercentage} + '%'"></span></td>
      <td th:text="${review.managerRemarks}"></td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
