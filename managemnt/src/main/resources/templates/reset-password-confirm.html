<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirm Password Reset — SmartStaffPro</title>
    <style>
        /* Reusing your consistent application styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #333; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 15px;}
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .alert-error { color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 5px; margin-bottom: 20px; text-align: center; border: 1px solid #f5c6cb; }
        .alert-info { color: #0c5460; background-color: #d1ecf1; padding: 10px; border-radius: 5px; margin-bottom: 20px; text-align: center; font-size: 14px; border: 1px solid #bee5eb; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Set New Password</h2>

    <div class="alert-info">
        Check your email for the temporary password we just sent you.
    </div>

    <!-- Displays error messages like "Passwords do not match" or "Invalid temporary password" -->
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/reset-password-confirm}" method="post">

        <div class="form-group">
            <label>Username</label>
            <!-- We pre-fill this from the URL and make it readonly so they don't have to type it again -->
            <input type="text" name="username" th:value="${username}" readonly required style="background-color: #e9ecef; cursor: not-allowed;"/>
        </div>

        <div class="form-group">
            <label>Temporary Password (from email)</label>
            <input type="password" name="tempPassword" required autofocus/>
        </div>

        <div class="form-group">
            <label>New Permanent Password</label>
            <input type="password" name="newPassword" required/>
        </div>

        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirmPassword" required/>
        </div>

        <button type="submit">Confirm & Save</button>
    </form>
</div>

</body>
</html>
