<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payroll Summaries — SmartStaffPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; margin: 0; margin-left: 250px; padding: 40px; color: #1f2937; }

        .glass-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); max-width: 900px; margin: 0 auto; }

        h2 { color: #1f2937; margin-top: 0; border-bottom: 2px solid #f3f4f6; padding-bottom: 15px; margin-bottom: 20px; font-weight: 700;}

        .total-banner { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2); }
        .total-banner h3 { margin: 0; font-size: 16px; font-weight: 500; opacity: 0.9; }
        .total-banner .amount { font-size: 28px; font-weight: 700; margin: 0; }

        table { width: 100%; border-collapse: collapse; font-size: 15px; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #f3f4f6; }
        th { background-color: #f8fafc; font-weight: 600; color: #64748b; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }

        .dept-name { font-weight: 600; color: #334155; }
        .currency { font-family: monospace; font-size: 16px; color: #0f172a; font-weight: 500; }
    </style>
</head>
<body>

<div th:replace="~{fragments :: sidebar}"></div>

<div class="glass-card">
    <h2>Financial Payroll Summaries</h2>
    <p style="color: #64748b; margin-bottom: 25px;">Departmental breakdown of net payroll expenses.</p>

    <!-- PBI-18: Drill-Down Filter Form -->
    <div style="background: #f8fafc; padding: 20px; border-radius: 15px; margin-bottom: 25px; border: 1px solid #e2e8f0;">
        <form action="/payroll/summary" method="GET" style="display: flex; gap: 15px; align-items: flex-end;">

            <div style="flex: 1;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569;">Department</label>
                <select name="department" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: 'Inter', sans-serif;">
                    <option value="">All Departments</option>
                    <option value="IT" th:selected="${selectedDepartment == 'IT'}">IT</option>
                    <option value="Operations" th:selected="${selectedDepartment == 'Operations'}">Operations</option>
                    <option value="HR" th:selected="${selectedDepartment == 'HR'}">Human Resources</option>
                    <option value="Finance" th:selected="${selectedDepartment == 'Finance'}">Finance</option>
                </select>
            </div>

            <div style="flex: 1;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569;">Pay Period Date (e.g. Sept 2026)</label>
                <input type="text" name="period" th:value="${selectedPeriod}" placeholder="All Dates" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: 'Inter', sans-serif;">
            </div>

            <div>
                <button type="submit" style="background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;">Apply Filter</button>
                <a href="/payroll/summary" style="margin-left: 15px; color: #64748b; text-decoration: none; font-size: 14px; font-weight: 500;">Clear</a>
            </div>
        </form>
    </div>

    <!-- Grand Total Banner -->
    <div class="total-banner">
        <div>
            <h3>Organization-Wide Net Payroll</h3>
            <p style="margin: 5px 0 0 0; font-size: 13px; opacity: 0.8;">Total dispersed across all departments</p>
        </div>
        <div class="amount" th:text="'LKR ' + ${#numbers.formatDecimal(totalOrganizationCost, 1, 'COMMA', 2, 'POINT')}">LKR 0.00</div>
    </div>

    <!-- Department Breakdown Table -->
    <table>
        <thead>
        <tr>
            <th>Department</th>
            <th style="text-align: right;">Total Net Expense (LKR)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${departmentCosts}">
            <td class="dept-name" th:text="${entry.key}"></td>
            <td class="currency" style="text-align: right;" th:text="${#numbers.formatDecimal(entry.value, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        <tr th:if="${#maps.isEmpty(departmentCosts)}">
            <td colspan="2" style="text-align: center; color: #94a3b8; padding: 30px; font-style: italic;">No payroll records found.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
