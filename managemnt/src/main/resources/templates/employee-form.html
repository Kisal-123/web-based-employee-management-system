<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Employee — SmartStaffPro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0;margin-left: 250px; padding: 40px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: #333; margin-top: 0; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        .btn-submit { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        .btn-submit:hover { background-color: #218838; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #0056b3; text-decoration: none; font-size: 14px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
    </style>
</head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>
<div class="form-container">
    <!-- Replace your current <h2> tag with this: -->
    <h2 th:text="${employee.id == null ? 'Add New Employee' : 'Edit Employee Profile'}">Add New Employee</h2>

    <!-- The form submits a POST request to /employees, sending the data to the Controller -->
    <form th:action="@{/employees}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="form-row">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" th:field="*{firstName}" required autofocus/>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" th:field="*{lastName}" required/>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" th:field="*{email}" required/>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" th:field="*{phone}"/>
            </div>
        </div>

        <div class="form-group">
            <label>Department</label>
            <select th:field="*{department}" required>
                <option value="" disabled selected>Select a Department</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Operations">Operations</option>
                <option value="IT">IT</option>
                <option value="Finance">Finance</option>
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Designation (Job Title)</label>
                <input type="text" th:field="*{designation}" required/>
            </div>
            <div class="form-group">
                <label>Hire Date</label>
                <input type="date" th:field="*{hireDate}" required/>
            </div>
        </div>

        <div class="form-group">
            <label>Basic Salary (Rs.)</label>
            <input type="number" step="0.01" th:field="*{basicSalary}" required/>
        </div>

        <button type="submit" class="btn-submit">Save Employee</button>
        <a href="/employees" class="back-link">Cancel and Return to Directory</a>
    </form>
</div>

</body>
</html>
