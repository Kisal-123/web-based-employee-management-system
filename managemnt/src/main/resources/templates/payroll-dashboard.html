<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payroll Management — SmartStaffPro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; margin-left: 250px; padding: 30px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }

        .form-row { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-end; background-color: #f8f9fa; padding: 20px; border-radius: 8px; flex-wrap: wrap;}
        .form-group { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
        label { font-weight: bold; color: #555; margin-bottom: 5px; font-size: 14px; }
        input, select { padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #0056b3; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; height: 38px; min-width: 150px;}

        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #6c757d; color: white; }
        .money { font-family: monospace; font-weight: bold; color: #28a745; }
        .deduction { font-family: monospace; font-weight: bold; color: #dc3545; }
        .alert-success { color: #155724; background-color: #d4edda; padding: 10px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

<div th:replace="~{fragments :: sidebar}"></div>

<div class="container">
    <h2>Payroll Generation & Records</h2>

    <div th:if="${param.success}" class="alert-success">Payslip generated successfully!</div>
    <div th:if="${param.updated}" class="alert-success">Payslip updated successfully!</div>
    <div th:if="${param.deleted}" class="alert-success" style="background-color: #f8d7da; color: #721c24; border-color: #f5c6cb;">Payslip deleted successfully.</div>

    <!-- The Generation Form -->
    <form th:action="@{/payroll/generate}" method="post" class="form-row">
        <div class="form-group">
            <label>Select Employee</label>
            <select name="employeeId" required>
                <option value="" disabled selected>-- Select an Employee --</option>
                <option th:each="emp : ${employees}" th:if="${emp.status != 'TERMINATED'}" th:value="${emp.id}" th:text="${emp.firstName + ' ' + emp.lastName}"></option>
            </select>
        </div>
        <div class="form-group">
            <label>Pay Period</label>
            <input type="text" name="payPeriod" placeholder="Month YYYY" required/>
        </div>
        <div class="form-group">
            <label>Allowances (Rs.)</label>
            <input type="number" step="0.01" name="allowances" value="0.0" required/>
        </div>
        <div class="form-group">
            <label>Deductions/Tax (Rs.)</label>
            <input type="number" step="0.01" name="deductions" value="0.0" required/>
        </div>
        <div class="form-group" style="flex: 0;">
            <button type="submit">Generate Payslip</button>
        </div>
    </form>

    <!-- The Financial Table -->
    <table>
        <thead>
        <tr>
            <th>Period</th>
            <th>Employee</th>
            <th>Basic Salary</th>
            <th>OT Pay</th>
            <th>Allowances</th>
            <th>Gross Salary</th>
            <th>EPF (8%)</th>
            <th>APIT Tax</th>
            <th>Deductions</th>
            <th>Net Take-Home</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pay : ${payslips}">
            <td th:text="${pay.payPeriod}"></td>
            <td th:text="${pay.employee.firstName + ' ' + pay.employee.lastName}"></td>
            <td class="money" th:text="${pay.basicSalary}"></td>
            <td class="money" th:text="${pay.overtimePay}"></td>
            <td class="money" th:text="${pay.allowances}"></td>
            <td class="money" style="color: #0056b3;" th:text="${pay.grossSalary}"></td>
            <td class="deduction" th:text="${pay.epfDeduction}"></td>

            <!-- CORRECTED APIT AND DEDUCTIONS ALIGNMENT -->
            <td class="deduction" th:text="${pay.apitTax}"></td>
            <td class="deduction" th:text="${pay.deductions}"></td>

            <td class="money" style="font-size: 15px;" th:text="${pay.netSalary}"></td>
            <td>
                <div style="display: flex; gap: 5px;">
                    <!-- NEW PDF DOWNLOAD BUTTON -->
                    <a th:href="@{/payroll/download/{id}(id=${pay.id})}" style="background-color: #17a2b8; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: bold;">PDF</a>
                    <a th:href="@{/payroll/edit/{id}(id=${pay.id})}" style="background-color: #ffc107; color: #333; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: bold;">Edit</a>
                    <form th:action="@{/payroll/delete/{id}(id=${pay.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this payslip?');">
                        <button type="submit" style="background-color: #dc3545; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; height: auto; min-width: auto;">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        <!-- Colspan updated to 11 to span across the whole table if empty -->
        <tr th:if="${#lists.isEmpty(payslips)}">
            <td colspan="11" style="text-align: center; color: #777;">No payroll records generated yet.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
