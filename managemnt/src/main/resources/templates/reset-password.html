<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mandatory Password Reset</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
    h2 { text-align: center; color: #333; margin-bottom: 10px; }
    p { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #555; font-weight: bold; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
    button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #004494; }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Update Password</h2>
  <p>Since this is your first time logging in, you are required to set a new password.</p>

  <form th:action="@{/reset-password}" method="post">
    <div class="form-group">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" name="newPassword" required autofocus/>
    </div>
    <button type="submit">Update & Continue</button>
  </form>
</div>

</body>
</html>
