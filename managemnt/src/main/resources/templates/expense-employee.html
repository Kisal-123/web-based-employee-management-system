<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submit Expense Claim</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; margin-left: 250px; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 20px;}
        .panel { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .alert-success { color: #155724; background-color: #d4edda; padding: 10px; border-radius: 5px; margin-bottom: 20px; text-align: center; border: 1px solid #c3e6cb; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background-color: #6c757d; color: white; }
        .badge { padding: 5px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
        .badge-pending { background-color: #ffc107; color: #333; }
        .badge-approved { background-color: #28a745; }
        .badge-rejected { background-color: #dc3545; }
        .badge-paid { background-color: #17a2b8; }
    </style>
</head>
<body>

<div th:replace="~{fragments :: sidebar}"></div>

<div class="panel">
    <h2>Submit Expense Reimbursement</h2>
    <div th:if="${param.success}" class="alert-success">Expense claim submitted successfully!</div>
    <form th:action="@{/expenses/submit}" th:object="${expenseClaim}" method="post">
        <div class="form-group">
            <label>Select Employee:</label>
            <select th:field="*{employee.id}" required>
                <option value="" disabled selected>-- Select Your Name --</option>
                <option th:each="emp : ${employees}" th:if="${emp.status != 'TERMINATED'}" th:value="${emp.id}" th:text="${emp.firstName + ' ' + emp.lastName}"></option>
            </select>
        </div>
        <div class="form-group">
            <label>Description of Expense (e.g., Client Lunch, Train Ticket):</label>
            <input type="text" th:field="*{description}" required/>
        </div>
        <div class="form-group">
            <label>Amount (Rs.):</label>
            <input type="number" step="0.01" th:field="*{amount}" required/>
        </div>
        <button type="submit">Submit Claim</button>
    </form>
</div>

<div class="panel">
    <h2>My Expense History</h2>
    <table>
        <thead>
        <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="expense : ${myExpenses}">
            <td th:text="${expense.dateSubmitted}"></td>
            <td th:text="${expense.description}"></td>
            <td th:text="${'Rs. ' + expense.amount}"></td>
            <td>
                <span th:if="${expense.status == 'PENDING'}" class="badge badge-pending">PENDING</span>
                <span th:if="${expense.status == 'APPROVED'}" class="badge badge-approved">APPROVED</span>
                <span th:if="${expense.status == 'REJECTED'}" class="badge badge-rejected">REJECTED</span>
                <span th:if="${expense.status == 'PAID'}" class="badge badge-paid">PAID IN PAYROLL</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(myExpenses)}">
            <td colspan="4" style="text-align: center; color: #777;">You have no past expense claims.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
