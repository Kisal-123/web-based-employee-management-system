<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile — SmartStaffPro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; margin-left: 250px; padding: 40px; display: flex; justify-content: center; }
        .panel { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        .readonly-text { background-color: #e9ecef; cursor: not-allowed; color: #666; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .alert-success { color: #155724; background-color: #d4edda; padding: 10px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #c3e6cb; text-align: center;}
    </style>
</head>
<body>

<div th:replace="~{fragments :: sidebar}"></div>

<div class="panel">
    <h2>My Personal Profile</h2>

    <div th:if="${param.success}" class="alert-success">Profile updated successfully!</div>

    <!-- If their email isn't linked to an HR record yet -->
    <div th:if="${employee == null}" style="text-align: center; color: #dc3545; padding: 20px;">
        <h3>Profile Not Found</h3>
        <p>Your login email does not match any official HR records. Please contact the HR Manager.</p>
    </div>

    <!-- The Profile Form -->
    <form th:if="${employee != null}" th:action="@{/my-profile/update}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>First Name (Locked)</label>
                <input type="text" th:field="*{firstName}" class="readonly-text" readonly/>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Last Name (Locked)</label>
                <input type="text" th:field="*{lastName}" class="readonly-text" readonly/>
            </div>
        </div>

        <div class="form-group">
            <label>Official Email (Locked)</label>
            <input type="email" th:field="*{email}" class="readonly-text" readonly/>
        </div>

        <h3 style="margin-top: 30px; border-bottom: 1px solid #eee; padding-bottom: 5px; color: #0056b3;">Contact Information (Editable)</h3>

        <div class="form-group">
            <label>My Phone Number</label>
            <input type="text" th:field="*{phone}" />
        </div>

        <div class="form-group">
            <label>Emergency Contact Name</label>
            <input type="text" th:field="*{emergencyContactName}" placeholder="e.g., Jane Doe (Spouse)"/>
        </div>

        <div class="form-group">
            <label>Emergency Contact Phone</label>
            <input type="text" th:field="*{emergencyContactPhone}" placeholder="e.g., 0712345678"/>
        </div>

        <button type="submit">Update My Profile</button>
    </form>
</div>

</body>
</html>
