<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — SmartStaffPro</title>
    <style>
        /* Center the form on the screen with a nice background */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Style the login box */
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background-color: #004494;
        }

        /* Styling for Spring Security messages */
        .alert-error {
            color: #721c24;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            color: #155724;
            background-color: #d4edda;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>SmartStaffPro Login</h2>

    <!-- Spring Security automatically appends ?error to the URL if login fails -->
    <div th:if="${param.error}" class="alert-error">
        Invalid username or password.
    </div>

    <!-- Spring Security automatically appends ?logout to the URL when logging out -->
    <div th:if="${param.logout}" class="alert-success">
        You have been successfully logged out.
    </div>

    <!-- Appears after a successful password reset -->
    <div th:if="${param.resetSuccess}" class="alert-success">
        Password successfully updated! You can now log in.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus/>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required/>
        </div>

        <button type="submit">Login</button>
    </form>

    <!-- MOVED OUTSIDE THE FORM & UPDATED TO th:href -->
    <div style="text-align: center; margin-top: 20px;">
        <a th:href="@{/forgot-password}" style="color: #0056b3; text-decoration: none; font-size: 14px;">Forgot Password?</a>
    </div>

    <div style="text-align: center; margin-top: 10px;">
        <span style="font-size: 14px; color: #666;">Don't have an account? </span>
        <a th:href="@{/register}" style="color: #0056b3; text-decoration: none; font-size: 14px;">Register here</a>
    </div>
</div>

</body>
</html>
