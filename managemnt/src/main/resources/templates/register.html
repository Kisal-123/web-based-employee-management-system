<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register New User</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Register User</h2>

    <!-- The th:action points to your @PostMapping URL, and th:object binds to the "user" you passed in the @GetMapping -->
    <form th:action="@{/register}" th:object="${user}" method="post">

        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" th:field="*{username}" required />
        </div>

        <!-- The new Email field -->
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" th:field="*{email}" required />
        </div>

        <!-- The Password field that went missing! -->
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" th:field="*{password}" required />
        </div>

        <div class="form-group">
            <label for="role">Role:</label>
            <select id="role" th:field="*{role}" required>
                <option value="HR_MANAGER">HR Manager</option>
                <option value="OPERATIONS_MANAGER">Operations Manager</option>
                <option value="IT_OFFICER">IT Officer</option>
                <option value="FINANCE_EXECUTIVE">Finance Executive</option>
                <option value="EMPLOYEE">Employee</option>
            </select>
        </div>

        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
