<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Evaluate Employee — SmartStaffPro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; margin: 0; margin-left: 250px; padding: 40px; color: #1f2937; }
    .form-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); max-width: 600px; }
    h2 { margin-top: 0; color: #4f46e5; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 10px; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    .btn-submit { background-color: #4f46e5; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-submit:hover { background-color: #4338ca; }
  </style>
</head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>

<div class="form-container">
  <h2>Quarterly KPI & Appraisal</h2>
  <form th:action="@{/performance/save}" th:object="${review}" method="post">

    <div class="form-group">
      <label>Select Employee:</label>
      <select th:field="*{employee}" required>
        <option value="" disabled selected>-- Choose an Employee --</option>
        <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.firstName + ' ' + emp.lastName}"></option>
      </select>
    </div>

    <div class="form-group">
      <label>Review Period (e.g., 2026 - Q3):</label>
      <input type="text" th:field="*{reviewPeriod}" placeholder="2026 - Q3" required>
    </div>

    <div class="form-group">
      <label>Assigned KPI Goals:</label>
      <textarea th:field="*{kpiGoals}" rows="3" placeholder="List the specific targets..." required></textarea>
    </div>

    <div class="form-group">
      <label>Performance Rating (1-5):</label>
      <select th:field="*{rating}" required>
        <option value="5">5 - Outstanding (15% Bonus)</option>
        <option value="4">4 - Exceeds Expectations (10% Bonus)</option>
        <option value="3" selected>3 - Meets Expectations (5% Bonus)</option>
        <option value="2">2 - Needs Improvement (0% Bonus)</option>
        <option value="1">1 - Unsatisfactory (0% Bonus)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Manager Remarks:</label>
      <textarea th:field="*{managerRemarks}" rows="3" placeholder="Feedback on their performance..."></textarea>
    </div>

    <button type="submit" class="btn-submit">Submit Appraisal</button>
  </form>
</div>
</body>
</html>
